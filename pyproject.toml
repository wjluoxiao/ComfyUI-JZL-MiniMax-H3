[project]
name = "comfyui-jzl-minimax-h3"
description = "JZL MiniMax H3 nodes for ComfyUI: reference-to-video conditioning, one-click comic creation tools and llama-cpp model loader (V1 + V3 hybrid)."
version = "0.9.09"
license = { file = "LICENSE" }
dependencies = []
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/wjluoxiao/ComfyUI-JZL-MiniMax-H3"
Homepage = "https://github.com/wjluoxiao/ComfyUI-JZL-MiniMax-H3"
Documentation = "https://github.com/wjluoxiao/ComfyUI-JZL-MiniMax-H3#readme"

[tool.comfy]
PublisherId = "wjluoxiao"
DisplayName = "ComfyUI-JZL-MiniMax-H3"
Icon = "icon.png"
